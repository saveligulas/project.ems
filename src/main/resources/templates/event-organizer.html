<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Blueprints</title>
    <link rel="stylesheet" href="../static/css/stylesheet.css" th:href="@{/css/stylesheet.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<main class="container">
    <h2 class="text-center">Event Blueprints</h2>

    <!-- Create Blueprint Button -->
    <div class="text-center my-4">
        <a href="./create-eventTemplate.html" th:href="@{/create-eventTemplate}" class="btn btn-primary">Create New Blueprint</a>
    </div>

    <!-- List of Event Blueprints -->
    <div class="card my-4">
        <h3 class="card-title">Your Blueprints</h3>
        <ul class="list-group">
            <li class="list-group-item"th:each="eventTemplate: ${blueprints}">
                <a  th:text="${eventTemplate.name}"></a>
            </li>
        </ul>
    </div>

    <!-- List of Planned Events -->
    <div class="card my-4">
        <h3 class="card-title">Planned Events</h3>
        <ul class="list-group">
            <li class="list-group-item"><a href="/event/101">Conference 2024 - January 15, 2024</a></li>
            <li class="list-group-item"><a href="/event/102">Product Launch - March 22, 2024</a></li>
            <li class="list-group-item"><a href="/event/103">Training Session - April 5, 2024</a></li>
        </ul>
    </div>
</main>
</body>
</html>
