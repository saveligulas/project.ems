<!--
    TODO: Make the fields errors dynamic with the basePath to allow multiple addresses. Now it only works with one field called address
-->
<div th:fragment="address(address)">
    <h4 class="text-center">Address</h4>
    <article>
        <fieldset class="grid">
            <label>
                Country *
                <select th:field="*{address.country}">
                    <option selected disabled value="">
                        Select your Country...
                    </option>
                    <option
                            th:each="countryOption : ${countries}"
                            th:text="${countryOption.getName()}"
                            th:value="${countryOption}">
                    </option>
                </select>
            </label>
            <label>
                Region
                <input
                        placeholder="Region"
                        type="text"
                        name="region"
                        th:field="*{address.region}"
                />
            </label>
        </fieldset>
        <fieldset class="grid">
            <label>
                City *
                <input
                        placeholder="City"
                        type="text"
                        name="city"
                        th:field="*{address.city}"
                />
            </label>
            <label>
                Postal Code *
                <input
                        type="number"
                        step="1"
                        name="zip"
                        th:field="*{address.zip}"
                />
            </label>
        </fieldset>
        <fieldset class="grid">
            <label>
                Street *
                <input
                        placeholder="e.g. Eventastic Street"
                        type="text"
                        name="street"
                        th:field="*{address.street}"
                />
            </label>
            <label>
                House Number
                <input
                        placeholder="e.g. 3a Top 9"
                        type="text"
                        name="houseNumber"
                        th:field="*{address.houseNumber}"
                />
            </label>
        </fieldset>
        <fieldset>
            <textarea
                    name="optionalText"
                    placeholder="Please provide additional information if necessary..."
                    aria-label="Professional short bio"
                    th:field="*{address.optionalText}"
                    maxlength="150">
            </textarea>
        </fieldset>
    </article>
</div>
