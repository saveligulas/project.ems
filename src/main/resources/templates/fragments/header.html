<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Header Fragment</title>
    <link rel="stylesheet" href="../../static/css/stylesheet.css" th:href="@{/css/stylesheet.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-5.3.3-dist/css/bootstrap.min.css}">
    <script th:src="@{/bootstrap-5.3.3-dist/js/bootstrap.min.js}"></script>
</head>
<body>
<!--@thymesVar id="user" type="fhv.team11.project.ems.commons.controller.base.attribute.UserAttributes"-->
<header th:fragment="header" class="main-header">
    <div class="header-left">
        <h1>
            <a href="/" th:href="@{/index}" style="text-decoration: none; color: inherit;">Eventastic</a>
        </h1>
    </div>

    <nav class="header-center">
        <ul>
            <li><a href="./bookings-view.html" th:href="@{/bookings}">Bookings</a></li>
            <li><a href="./event-organizer.html" th:href="@{/event}">Events</a></li>
            <li><a href="/users" th:href="@{/users}">Users</a></li>
        </ul>
    </nav>

    <div class="header-right">
        <span th:if="${user?.isAuthenticated()}">
            <!-- Dropdown für den Benutzer -->
            <div class="dropdown d-inline">
                <a href="#" id="userDropdown" class="btn btn-outline header-btn dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false" th:text="${user?.getUsername()}"></a>
                <ul class="dropdown-menu" aria-labelledby="userDropdown">
                    <li><a class="dropdown-item" href="/account" th:href="@{/account}">Account</a></li>
                    <li><a class="dropdown-item" href="/settings" th:href="@{/settings}">Settings</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="/logout" th:href="@{/logout}">Logout</a></li>
                </ul>
            </div>
            <a href="./event/manage" th:href="@{/event/manage}" class="btn btn-primary header-btn">Create Event</a>
        </span>

        <span th:unless="${user?.isAuthenticated()}">
            <a href="./login.html" th:href="@{/login}" class="btn btn-outline header-btn">Login</a>
            <a href="./register.html" th:href="@{/register}" class="btn btn-primary header-btn">Register</a>
        </span>
    </div>
</header>
</body>
</html>
