<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{base}"
      th:with="title='Plan Event'">
<body>

<div layout:fragment="content">
    <h1>Organizations</h1>

    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#organizationModal">
        Add Organization
    </button>

    <div class="modal fade" id="organizationModal" tabindex="-1" aria-labelledby="organizationModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="organizationModalLabel">Add Organization</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form th:action="@{/admin/organizations}" th:object="${organization}" method="post">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="type" class="form-label">Type</label>
                            <select id="type" class="form-select" th:field="*{type}">
                                <option value="" disabled selected>Select Type</option>
                                <option th:each="type : ${organizationTypes}"
                                        th:value="${type}"
                                        th:text="${type}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" id="name" class="form-control" th:field="*{name}" placeholder="Enter organization name">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>Id</th>
            <th>Type</th>
            <th>Name</th>
            <th>Short Name</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="organization : ${organizations}" th:onclick="|location.href='@{/admin/organization/details/{id}(id=${organization.id})}'|">
            <td th:text="${organization?.id}"></td>
            <td th:text="${organization?.type}"></td>
            <td th:text="${organization?.name}"></td>
            <td th:text="${organization?.shortName}"></td>
        </tr>
        </tbody>
    </table>
</div>


</body>
</html>
