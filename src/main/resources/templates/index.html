<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>
        Find Your Nature - [[${title}]]
    </title>
    <link rel="stylesheet" href="../static/css/stylesheet.css" th:href="@{/css/stylesheet.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-5.3.3-dist/css/bootstrap.min.css}">
    <script th:src="@{/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js}"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-x: hidden;
            background: linear-gradient(to bottom right, #e8f5e9, #b2dfdb);
            background-attachment: fixed;
            background-size: cover;
            font-family: 'Arial', sans-serif;
        }

        .hero-section {
            flex: 1;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 12rem 0;
            height: 600px;

            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('/images/nature-background.jpg');
            background-size: 100% auto;
            background-position: center;
            width: 100vw;
        }

        .hero-section h1 {
            font-size: 3.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        .hero-section p {
            font-size: 1.5rem;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        }

        .search-bar {
            margin-top: 3rem;
            margin-bottom: 3rem;
            width: 60%;
        }

        .input-group {
            max-width: 100%;
            margin: 0 auto;
        }

        .input-group .form-control {
            border-radius: 30px 0 0 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            height: 56px;
        }

        .input-group .btn-primary {
            background-color: #00796b;
            border-color: #00796b;
            border-radius: 0 30px 30px 0;
            transition: all 0.3s;
            font-weight: bold;
            height: 56px;
        }

        .input-group .btn-primary:hover {
            background-color: #004d40;
            border-color: #004d40;
            transform: scale(1.05);
        }

        .additional-filters {
            margin-top: 20px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .additional-filters .form-group {
            margin-bottom: 15px;
        }

        .additional-filters .form-control {
            border-radius: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            height: 56px;
        }

        .additional-filters .row {
            display: flex;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: flex-start;
        }

        .additional-filters .row > div {
            flex: 1;
            padding: 0 10px;
        }

        .events-section {
            background-color: white;
            padding: 2rem;
            margin: 0;
            width: 100vw;
        }

        .events-section h2 {
            text-align: center;
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 2rem;
        }

        .event-card {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            margin: 1rem;
            border-radius: 10px;
            flex: 1;
            width: 300px;
            height: 350px;
            background: #e8f5e9;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: #333;
        }

        .event-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .event-card h3 {
            color: #00796b;
            font-weight: bold;
        }

        .event-card p {
            margin-top: 0.5rem;
            color: #004d40;
        }

        .event-card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: flex-start;
            margin-top: 3rem;
        }

        .show-all-button {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
<!-- Header Section -->
<th:block th:if="${!#bools.isTrue(hideHeader)}">
    <div layout:fragment="header" th:replace="fragments/header :: header"></div>
</th:block>

<!-- Hero Section with Search Bar -->
<div class="hero-section">
    <div class="container-fluid d-flex flex-column align-items-center">
        <h1>Find Your Nature</h1>
        <p>Search for a city, park, or trail name</p>
        <form action="/search" method="get" class="search-bar mt-4">
            <div class="input-group">
                <input type="text" class="form-control" placeholder="Search by city, park, or trail name" name="query">
                <button class="btn btn-primary" type="submit">Search</button>
            </div>
            <div class="additional-filters mt-4">
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <div class="input-group">
                                <input type="number" class="form-control" placeholder="Price From" name="priceFrom">
                                <input type="number" class="form-control" placeholder="Price To" name="priceTo">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <select class="form-control" name="category">
                                <option value="">Select Category</option>
                                <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group">
                            <input type="number" class="form-control" placeholder="Number of participants" name="participants">
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Events Section -->
<div class="events-section">
    <div class="container-fluid">
        <h2>These are some events for you...</h2>
        <div class="event-card-container">
            <a th:each="event : ${activeEvents}" th:href="@{/active-events/{id}(id=${event.activeEventListDTO.id})}" class="event-card">
                <h3 th:text="${event.eventTemplateDTO.name}">Event Name</h3>
                <p th:each="date : ${event.activeEventDates}" th:text="'Date: ' + ${date.date}">Date</p>
                <p th:text="'Location: ' + ${event.eventTemplateDTO.address.city}">Location</p>
            </a>
        </div>
    </div>
    <div class="show-all-button">
        <a class="btn btn-primary" th:href="@{/active-events}">Show All Events</a>
    </div>

</div>

</body>
</html>
