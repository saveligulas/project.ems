<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>
        Find Your Nature - [[${title}]]
    </title>
    <link rel="stylesheet" href="../static/css/stylesheet.css" th:href="@{/css/stylesheet.css}">
    <link rel="stylesheet" th:href="@{/bootstrap-5.3.3-dist/css/bootstrap.min.css}">
    <script th:src="@{/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js}"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-x: hidden;
            background: linear-gradient(to bottom right, #e8f5e9, #b2dfdb);
            background-attachment: fixed;
            background-size: cover;
            font-family: 'Arial', sans-serif;
        }

        .hero-section {
            flex: 1;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 7rem 0; /* Reduced padding to make height smaller */
            height: 300px; /* Set a fixed height */

            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('/images/nature-background.jpg');
            background-size: 100% auto;
            background-position: center;
            width: 100vw;
        }

        .hero-section h1 {
            font-size: 3.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
        }

        .hero-section p {
            font-size: 1.5rem;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
        }




        .search-bar {
            margin-top: 3rem;
            margin-bottom: 3rem;
            width: 60%;
        }

        .input-group {
            max-width: 100%;
            margin: 0 auto;
        }

        .input-group .form-control {
            border-radius: 30px 0 0 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            height: 56px;
        }

        .input-group .btn-primary {
            background-color: #00796b;
            border-color: #00796b;
            border-radius: 0 30px 30px 0;
            transition: all 0.3s;
            font-weight: bold;
            height: 56px;
        }

        .input-group .btn-primary:hover {
            background-color: #004d40;
            border-color: #004d40;
            transform: scale(1.05);
        }

        .additional-filters {
            margin-top: 20px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .additional-filters .form-group {
            margin-bottom: 15px;
        }

        .additional-filters .form-control {
            border-radius: 30px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            height: 56px;
        }

        .additional-filters .row {
            display: flex;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: flex-start;
        }

        .additional-filters .row > div {
            flex: 1;
            padding: 0 10px;
        }
    </style>
</head>
<body>
<!-- Header Section -->
<th:block th:if="${!#bools.isTrue(hideHeader)}">
    <div layout:fragment="header" th:replace="fragments/header :: header"></div>
</th:block>

<!-- Hero Section with Search Bar -->
<div class="hero-section">
    <div class="container-fluid d-flex flex-column align-items-center">
        <h1>Find Your Nature</h1>
        <p>Search for a city, park, or trail name</p>
        <form action="/search" method="get" class="search-bar mt-4">
            <div class="input-group">
                <input type="text" class="form-control" placeholder="Search by city, park, or trail name" name="query">
                <button class="btn btn-primary" type="submit">Search</button>
            </div>
            <div class="additional-filters mt-4">
                <div class="row">
                    <div class="col-md-4">
                        <div class="form-group">
                            <div class="input-group">
                                <input type="number" class="form-control" placeholder="Price From" name="priceFrom">
                                <input type="number" class="form-control" placeholder="Price To" name="priceTo">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group">
                            <select class="form-control" name="category">
                                <option value="">Select Category</option>
                                <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group">
                            <input type="number" class="form-control" placeholder="Number of participants" name="participants">
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>


</body>
</html>
