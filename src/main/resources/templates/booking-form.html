<body>

<div layout:fragment="content" class="container-fluid mt-5">
    <div class="event-details">
        <h1 class="text-center mb-4"
            th:text="'Booking for ' + (${activeEvent?.eventTemplateDTO?.name} ?: 'Unnamed Event')">
            Booking for Event Name
        </h1>
        <!--
        <div th:if="${user.hasRole('EMPLOYEE')}">

                    Search for Customer Profile
                </div>

                        <div class="form-group">

        <div th:if="${user.hasRole('CUSTOMER')}">
            <div th:if="${!user.hasCustomerProfile()}">
                <script>
                    document.addEventListener('DOMContentLoaded', function () {
                        const userConfirmed = confirm("You don't have a customer profile. Do you want to proceed?");
                        if (userConfirmed) {
                            window.location.href = '/profiles/customer/create';
                        } else {
                            window.location.href = '/home';
                        }
                    });
                </script>
            </div>
        </div>


        <!-- Success Message -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <!-- Error Message -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/active-events/{id}/booking(id=${activeEvent.activeEventListDTO.getId()})}" th:object="${createBooking}" method="post"
               novalidate>

            <!--
            <label for="financerId" class="form-label">Financer Id</label>
            <input type="number" id="financerId" name="financerId" th:field="*{financerId}" th:value="${user?.getCustomerProfileId()}" readonly>
            -->
            <input type="hidden" name="financerId" th:value="${user?.getCustomerProfileId()}">

            <div class="card mt-4">
                <div class="card-header bg-primary text-white">
                    Customer Profile
                </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" name="firstName" disabled th:value="${user?.getCustomerProfileDTO().firstName}">
                        </div>
                       <div class="mb-3">
                           <label for="lastName" class="form-label">Last Name</label>
                           <input type="text" class="form-control" id="lastName" name="lastName" disabled th:value="${user?.getCustomerProfileDTO().lastName}">
                        </div>
                      <div class="mb-3">
                          <label for="phoneNumber" class="form-label">Phone Number</label>
                          <input type="text" class="form-control" id="phoneNumber" name="phoneNumber" disabled th:value="${user?.getCustomerProfileDTO().phoneNumber}">
                      </div>
                    </div>
            </div>
            <!-- Booked Places -->
            <div class="form-group">
                <label for="bookedPlaces" class="form-label"><strong>Number of Places:</strong></label>
                <input type="number" id="bookedPlaces" th:field="*{bookedPlaces}" class="form-control"
                       placeholder="Enter number of places">
            </div>

            <button type="submit" class="btn btn-primary">Submit Booking</button>
        </form>

        <p class="mt-4">
            <a th:href="@{/active-events}" class="btn btn-secondary">Back to All Events</a>
        </p>
    </div>
</div>
</body>
