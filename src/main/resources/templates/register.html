<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="../static/css/stylesheet.css" th:href="@{/css/stylesheet.css}">
</head>
<body>
<div class="auth-form">
  <h2>Register</h2>
  <form th:action="@{/register}" method="POST" th:object="${registerRequest}" novalidate>
    <div class="form-group">
      <label for="email">Email:</label>
      <input type="email" id="email" name="email"
             th:field="*{email}"
             th:classappend="${hasEmailError} ? 'input-error'">
      <span th:if="${emailError}"
            class="error-message"
            th:text="${emailError}"></span>
    </div>

    <div class="form-group">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password"
             th:field="*{password}"
             th:classappend="${#fields.hasErrors('password')} ? 'input-error'">
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" name="confirmPassword"
             th:field="*{confirmPassword}"
             th:classappend="${#fields.hasErrors('confirmPassword')} ? 'input-error'">
    </div>

    <ul th:if="${#fields.hasAnyErrors()}">
      <li th:each="err : ${#fields.allErrors()}"
          th:utext="${#strings.replace(err, '\\n', '<br />')}"
          th:text="${err}"
          class="error-message"></li>
    </ul>

    <button type="submit" class="btn btn-primary btn-full">Register</button>
  </form>

  <div class="auth-links">
    <p class="text-muted">Already have an account? <a href="/login">Login here</a></p>
  </div>
</div>
</body>
</html>
