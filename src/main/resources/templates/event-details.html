<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{base}"
      th:with="title='Event Details'">

<head>
    <title th:text="${title}">Event Details</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom right, #e8f5e9, #b2dfdb);
            background-attachment: fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            margin: 0 auto;
            height: 100%;
            width: 100%

        }

        .event-details {
            margin: 2rem auto;
            padding: 2rem;
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            height: 100%;
            width:100%;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .btn-book {
            margin-top: 1.5rem;
        }
    </style>
</head>

<body>
<div layout:fragment="content" class="container-fluid mt-5">
    <div class="event-details">
        <h1 th:text="${activeEvent.getEventTemplate().getName()}">Event Name</h1>
        <p><strong>Category:</strong> <span th:text="${activeEvent.getEventTemplate().getCategory()}">Category</span></p>
        <p><strong>Price:</strong> $<span th:text="${activeEvent.getEventTemplate().getPrice()}">Price</span></p>
        <p><strong>Location:</strong> <span th:text="${activeEvent.getEventTemplate().getAddress().getCountry()}">Country</span></p>
        <p><strong>Location:</strong> <span th:text="${activeEvent.getEventTemplate().getAddress().getRegion()}">Region</span></p>
        <p><strong>Location:</strong> <span th:text="${activeEvent.getEventTemplate().getAddress().getCity()}">City</span></p>
        <p><strong>Location:</strong> <span th:text="${activeEvent.getEventTemplate().getAddress().getStreet()}">Street</span></p>
        <p><strong>Location:</strong> <span th:text="${activeEvent.getEventTemplate().getAddress().getHouseNumber()}">House Number</span></p>




        <div class="form-group">
            <label class="form-label"><strong>Event Dates:</strong></label>
            <ul>
                <!-- Iterate through the list of dates and display them -->
                <li th:each="date : ${activeEvent.getEventDate()}"
                    th:text="${date.date}">
                    Event Date
                </li>
            </ul>
        </div>




        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/active-events}" class="btn btn-primary btn-book">Back to All Events</a>

            <a th:href="@{/active-events/{id}/booking(id=${activeEvent.getId()})}" class="btn btn-primary btn-book">Book Event</a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>

</html>
