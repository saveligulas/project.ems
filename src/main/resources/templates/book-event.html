<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Event</title>
    <link rel="stylesheet" href="../static/css/stylesheet.css">
</head>
<body>

<header th:fragment="header" class="main-header">
    <div class="header-left">
        <h1>Eventastic</h1>
    </div>

    <nav class="header-center">
        <ul>
            <li><a href="./index.html" th:href="@{/}">Home</a></li>
            <li><a href="./events.html" th:href="@{/events}">Events</a></li>
            <li><a href="./users.html" th:href="@{/users}">Users</a></li>
        </ul>
    </nav>

    <div class="header-right">
        <a href="./login.html" class="btn btn-outline header-btn">Login</a>
        <a href="./register.html" class="btn btn-primary header-btn">Register</a>
    </div>
</header>

<main class="form-container">
    <h2 class="text-center">Book an Event</h2>

    <form action="/submit-booking" method="post">
        <!-- Participant Information -->
        <div class="form-group">
            <label for="participantName"><strong>Name of Participant *</strong></label>
            <input type="text" id="participantName" name="participantName" required>
        </div>

        <!-- Address Information -->
        <div class="form-group">
            <label for="county"><strong>County *</strong></label>
            <input type="text" id="county" name="county" required>
        </div>
        <div class="form-group">
            <label for="postalCode"><strong>Postal Code *</strong></label>
            <input type="text" id="postalCode" name="postalCode" required>
        </div>
        <div class="form-group">
            <label for="street"><strong>Street *</strong></label>
            <input type="text" id="street" name="street" required>
        </div>
        <div class="form-group">
            <label for="houseNumber"><strong>House Number *</strong></label>
            <input type="text" id="houseNumber" name="houseNumber" required>
        </div>

        <!-- Additional Information -->
        <div class="form-group">
            <label for="additionalInfo"><strong>Additional Information</strong></label>
            <input type="text" id="additionalInfo" name="additionalInfo" placeholder="Any additional details">
        </div>

        <!-- Submit Button -->
        <div class="form-group text-center">
            <input type="submit" value="Book Event" class="btn btn-primary">
        </div>
    </form>
</main>

</body>
</html>
