<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{base}"
      th:with="title='All Active Events'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Active Events</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/stylesheet.css" th:href="@{/css/stylesheet.css}">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0 auto;

        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom right, #e8f5e9, #b2dfdb);
            background-attachment: fixed;
            background-size: cover;
        }

        .events-section {
            padding: 2rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 100%;
            width:100%;
        }

        .filter-section {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            margin-top: 90px;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 100%;
            width:100%;
        }

        .filter-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 100%;
            width:100%;
        }

        .event-card {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            margin: 1rem;
            border-radius: 10px;
            background: #e8f5e9;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            flex: 1 1 calc(25% - 2rem); /* Make each card take 25% of the row minus margin */
            box-sizing: border-box;
        }

        .event-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .event-card-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between; /* Distribute the cards evenly across the row */
            margin-top: 3rem;
            gap: 1rem;
            display: flex;
            flex-direction: column;
            height: 100%;
            width:100%;
        }

        .form-label-inline {
            display: flex;
            align-items: center;
        }

        .form-label-inline label {
            margin-right: 0.5rem;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<!-- Events Section -->
<main class="container-fluid" style="padding: 0;">
    <div layout:fragment="content">
        <!-- Filter Section with Separate Background -->
        <div class="filter-section">
            <form action="/filter" method="get" class="filter-form mb-5">
                <div class="row align-items-center justify-content-center">
                    <div class="col-md-4 mb-3 form-label-inline">
                        <label for="priceFrom" class="form-label"><strong>Price From</strong></label>
                        <input type="number" id="priceFrom" name="priceFrom" class="form-control" placeholder="Min Price">
                    </div>
                    <div class="col-md-4 mb-3 form-label-inline">
                        <label for="priceTo" class="form-label"><strong>Price To</strong></label>
                        <input type="number" id="priceTo" name="priceTo" class="form-control" placeholder="Max Price">
                    </div>
                    <div class="col-md-4 mb-3 form-label-inline">
                        <label for="participants" class="form-label"><strong>Participants</strong></label>
                        <input type="number" id="participants" name="participants" class="form-control" placeholder="Number of Participants">
                    </div>
                    <div class="col-md-4 mb-3 form-label-inline">
                        <label for="category" class="form-label"><strong>Category</strong></label>
                        <select id="category" name="category" class="form-control">
                            <option value="">Select Category</option>
                            <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3 form-label-inline">
                        <label for="dateFrom" class="form-label"><strong>Date From</strong></label>
                        <input type="date" id="dateFrom" name="dateFrom" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3 form-label-inline">
                        <label for="dateTo" class="form-label"><strong>Date To</strong></label>
                        <input type="date" id="dateTo" name="dateTo" class="form-control">
                    </div>
                    <div class="col-md-4 mb-3">
                        <button type="submit" class="btn btn-primary">Apply Filter</button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Events Section -->
        <div class="events-section">
            <div class="event-card-container">
                <a th:each="event, iterStat : ${activeEvents}" th:href="@{/active-events/{id}(id=${event.getActiveEventListDTO().getId()})}" class="event-card" th:style="${iterStat.index % 2 == 0} ? 'background: #f1f8e9;' : ''">
                    <h3 th:text="${event.getActiveEventListDTO().getId()}">Event Name</h3>
                </a>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
