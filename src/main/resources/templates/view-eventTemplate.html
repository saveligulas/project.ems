<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueprint Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/stylesheet.css" th:href="@{/css/stylesheet.css}">
</head>
<body class="bg-light">

<header layout:replace="header"></header>
<main class="container mt-5">
    <div layout:fragment="content">
        <div class="card p-4 shadow-sm">
            <h2 class="text-center mb-4">Blueprint Details</h2>

            <!-- Blueprint Details -->
            <div class="card-body">
                <!-- Name -->
                <div class="info-group mb-3">
                    <label for="name" class="form-label"><strong>Name:</strong></label>
                    <p id="name" class="border rounded p-2" th:text="${Template.name}">Template Name</p>
                </div>

                <!-- Category -->
                <div class="info-group mb-3">
                    <label for="category" class="form-label"><strong>Category:</strong></label>
                    <p id="category" class="border rounded p-2" th:text="${Template.category}">Category</p>
                </div>

                <!-- Price -->
                <div class="info-group mb-3">
                    <label for="price" class="form-label"><strong>Price:</strong></label>
                    <p id="price" class="border rounded p-2" th:text="${Template.price}">Price</p>
                </div>

                <!-- Max Participants -->
                <div class="info-group mb-3">
                    <label for="maxParticipants" class="form-label"><strong>Max Participants:</strong></label>
                    <p id="maxParticipants" class="border rounded p-2" th:text="${Template.maxParticipants}">Max Participants</p>
                </div>

                <!-- Min Participants -->
                <div class="info-group mb-3">
                    <label for="minParticipants" class="form-label"><strong>Min Participants:</strong></label>
                    <p id="minParticipants" class="border rounded p-2" th:text="${Template.minParticipants}">Min Participants</p>
                </div>

                <!-- Location -->
                <div class="info-group mb-3">
                    <label for="location" class="form-label"><strong>Location:</strong></label>
                    <p id="location" class="border rounded p-2" th:text="${Template.address.region}">Region</p>
                </div>

                <!-- County -->
                <div class="info-group mb-3">
                    <label for="county" class="form-label"><strong>County:</strong></label>
                    <p id="county" class="border rounded p-2" th:text="${Template.address.country}">Country</p>
                </div>

                <!-- ZIP Code -->
                <div class="info-group mb-3">
                    <label for="zip" class="form-label"><strong>ZIP Code:</strong></label>
                    <p id="zip" class="border rounded p-2" th:text="${Template.address.zip}">ZIP Code</p>
                </div>

                <!-- Street -->
                <div class="info-group mb-3">
                    <label for="street" class="form-label"><strong>Street:</strong></label>
                    <p id="street" class="border rounded p-2" th:text="${Template.address.street}">Street</p>
                </div>

                <!-- House Number -->
                <div class="info-group mb-3">
                    <label for="houseNumber" class="form-label"><strong>House Number:</strong></label>
                    <p id="houseNumber" class="border rounded p-2" th:text="${Template.address.houseNumber}">House Number</p>
                </div>

                <!-- Optional Line -->
                <div class="info-group mb-3">
                    <label for="optionalLine" class="form-label"><strong>Optional Line:</strong></label>
                    <p id="optionalLine" class="border rounded p-2" th:text="${Template.address.optionalText}">Optional Text</p>
                </div>
            </div>
        </div>

        <!-- Plan Event Button -->
        <div class="text-center mt-4">
            <a class="btn btn-primary" th:href="@{/event/manage/{id}/redirect(id=${listTemplate.id},name=${listTemplate.name})}">Plan Event</a>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
