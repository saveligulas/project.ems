<main class="container" layout:fragment="content">
    <h2 class="text-center">Blueprint Details</h2>

    <!-- Blueprint Information -->
    <div class="card">
        <div class="card-body">
            <div class="info-group" >
                <label for="name" ><strong>Name:</strong></label>
                <p id="name" th:text="${Template.name}"></p>
            </div>

            <div class="info-group">
                <label for="category" ><strong>Category:</strong></label>
                <p id="category" th:text="${Template.category}"></p>
            </div>

            <div class="info-group">
                <label for="price" ><strong>Price:</strong></label>
                <p id="price" th:text="${Template.price}"></p>
            </div>

            <div class="info-group">
                <label for="maxParticipants" ><strong>Max Participants:</strong></label>
                <p id="maxParticipants" th:text="${Template.maxParticipants}"></p>
            </div>

            <div class="info-group">
                <label for="minParticipants" ><strong>Min Participants:</strong></label>
                <p id="minParticipants" th:text="${Template.minParticipants}"></p>
            </div>

            <div class="info-group">
                <label for="location" ><strong>Location:</strong></label>
                <p id="location" th:text="${Template.address.region}"></p>
            </div>

            <div class="info-group">
                <label for="county" ><strong>County:</strong></label>
                <p id="county" th:text="${Template.address.country}"></p>
            </div>

            <div class="info-group">
                <label for="zip" ><strong>ZIP Code:</strong></label>
                <p id="zip" th:text="${Template.address.zip}"></p>
            </div>

            <div class="info-group">
                <label for="street" ><strong>Street:</strong></label>
                <p id="street" th:text="${Template.address.street}"></p>
            </div>

            <div class="info-group">
                <label for="houseNumber" ><strong>House Number:</strong></label>
                <p id="houseNumber" th:text="${Template.address.houseNumber}"></p>
            </div>

            <div class="info-group">
                <label for="optionalLine" ><strong>Optional Line:</strong></label>
                <p id="optionalLine">Bring your own chair!</p>
            </div>
        </div>
    </div>

    <!-- Plan Event Button -->
    <div class="text-center mt-4">
        <button class="btn btn-primary" onclick="window.location.href='./plan-event.html';">Plan Event</button>
    </div>
</main>

</body>
</html>
