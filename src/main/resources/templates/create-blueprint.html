<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event Blueprint</title>
    <link rel="stylesheet" href="../static/css/stylesheet.css">
</head>
<body>

<header th:fragment="header" class="main-header">
    <div class="header-left">
        <h1>Eventastic</h1>
    </div>

    <nav class="header-center">
        <ul>
            <li><a href="./index.html" th:href="@{/}">Home</a></li>
            <li><a href="./events.html" th:href="@{/events}">Events</a></li>
            <li><a href="./users.html" th:href="@{/users}">Users</a></li>
        </ul>
    </nav>

    <div class="header-right">
        <a href="./login.html" class="btn btn-outline header-btn">Login</a>
        <a href="./register.html" class="btn btn-primary header-btn">Register</a>
    </div>
</header>

<main class="form-container">
    <h2 class="text-center">Create Event Blueprint</h2>
    <form action="/create-blueprint" method="post">

        <div class="form-group">
            <label for="name"><strong>Name *</strong></label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="category"><strong>Category *</strong></label>
            <input type="text" id="category" name="category" required>
        </div>

        <div class="form-group">
            <label for="price"><strong>Price *</strong></label>
            <input type="number" id="price" name="price" required>
        </div>

        <div class="form-group">
            <label for="maxParticipants"><strong>Max Participants *</strong></label>
            <input type="number" id="maxParticipants" name="maxParticipants" required>
        </div>

        <div class="form-group">
            <label for="minParticipants"><strong>Min Participants *</strong></label>
            <input type="number" id="minParticipants" name="minParticipants" required>
        </div>

        <div class="form-group">
            <label for="location"><strong>Location *</strong></label>
            <input type="text" id="location" name="location" required>
        </div>

        <div class="form-group">
            <label for="county"><strong>County</strong></label>
            <input type="text" id="county" name="county" class="optional">
        </div>

        <div class="form-group">
            <label for="zip"><strong>ZIP Code</strong></label>
            <input type="text" id="zip" name="zip" class="optional">
        </div>

        <div class="form-group">
            <label for="street"><strong>Street</strong></label>
            <input type="text" id="street" name="street" class="optional">
        </div>

        <div class="form-group">
            <label for="houseNumber"><strong>House Number</strong></label>
            <input type="text" id="houseNumber" name="houseNumber" class="optional">
        </div>

        <div class="form-group">
            <label for="optionalLine"><strong>Optional Line</strong></label>
            <input type="text" id="optionalLine" name="optionalLine" class="optional">
        </div>

        <!-- Submit Button -->
        <div class="form-group text-center">
            <input type="submit" value="Create Blueprint" class="btn btn-primary">
        </div>

    </form>
</main>

</body>
</html>
