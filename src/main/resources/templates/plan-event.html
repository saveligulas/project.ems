<!DOCTYPE html>
<html lang="en"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{base}"
      th:with="title='Login'">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Event</title>
    <link rel="stylesheet" href="../static/css/stylesheet.css">
</head>
<body>

<main class="container">
    <div layout:fragment="content">
        <h2 class="text-center" th:text="${listTemplate.name}"></h2>

    <form th:action="@{/event/manage/{id}/plan(id=${listTemplate.id})}" method="post" th:object="${eventDate}" novalidate>

        <div class="form-group">
            <label for="name"><strong>Name *</strong></label>
            <input type="text" id="name" name="name" required th:field="*{name}">
        </div>

        <div class="form-group">
            <label for="date"><strong>Date *</strong></label>
            <input type="date" id="date" name="date" required th:field="*{date}">


            <div class="error-message" th:if="${#fields.hasErrors('date')}" th:errors="*{date}">

            </div>
        </div>




        <!-- Plan Event Button -->
        <div class="form-group text-center button-container">
            <button type="submit" class="btn btn-primary">Plan Event</button>
            <a class="btn btn-primary" th:href="@{/event/manage/{id}/plan/redirect(id=${listTemplate.id},name=${listTemplate.name})}">Plan Appointment</a>
        </div>

    </form>
        <div th:if="${session.bindingErrors != null}">
            <p th:each="error : ${session.bindingErrors.allErrors}" th:text="${error.defaultMessage}" class="error"></p>
        </div>

        <div>

            <div th:if="${#lists.isEmpty(wizard)}">
                <p>No dates available.</p>
            </div>


            <ul>
                <li th:each="eventDate : ${wizard.activeEventDates}">
                    <!-- Display the date -->
                    <span th:if="${eventDate.date != null}"
                          th:text="${eventDate.date}"></span>
                    <span th:if="${eventDate.date == null}">No Date Provided</span> -
                    <!-- Display the name -->
                    <span th:text="${eventDate.name}"></span>
                </li>
            </ul>

        </div>

    </div>
</main>

</body>
</html>
