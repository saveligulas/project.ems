<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Event</title>
    <link rel="stylesheet" href="../static/css/stylesheet.css">
</head>
<body>

<header th:fragment="header" class="main-header">
    <div class="header-left">
        <h1>Eventastic</h1>
    </div>

    <nav class="header-center">
        <ul>
            <li><a href="./index.html" th:href="@{/}">Home</a></li>
            <li><a href="./events.html" th:href="@{/events}">Events</a></li>
            <li><a href="./users.html" th:href="@{/users}">Users</a></li>
        </ul>
    </nav>

    <div class="header-right">
        <a href="./login.html" class="btn btn-outline header-btn">Login</a>
        <a href="./register.html" class="btn btn-primary header-btn">Register</a>
    </div>
</header>

<main class="container">
    <h2 class="text-center">Plan Event from Blueprint</h2>

    <form action="/plan-event" method="post">

        <div class="form-group">
            <label for="eventDate"><strong>Date *</strong></label>
            <input type="date" id="eventDate" name="eventDate" required>
        </div>

        <div class="form-group">
            <label for="eventTime"><strong>Time *</strong></label>
            <input type="time" id="eventTime" name="eventTime" required>
        </div>

        <div class="form-group">
            <label><strong>Template Name</strong></label>
            <p th:text="${ListTemplate.name}"></p>
        </div>

        <!-- Plan Event Button -->
        <div class="form-group text-center">
            <button type="submit" class="btn btn-primary">Plan Event</button>
        </div>

    </form>
</main>

</body>
</html>
