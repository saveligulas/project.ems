<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/stylesheet.css}"> <!-- Optional custom stylesheet -->
</head>
<body class="bg-light d-flex align-items-start justify-content-center min-vh-100 pt-5">
<div class="container d-flex justify-content-center">
  <div class="card p-4 shadow-sm" style="max-width: 500px; width: 100%; margin-top: 50px;">
    <!-- Login Form -->
    <div class="card-body">
      <h2 class="text-center mb-4">Welcome to Eventastic</h2>
      <p class="text-center text-muted mb-4">Log in to explore exciting events happening near you.</p>

      <form th:action="@{/authenticate}" method="POST" th:object="${authenticationRequest}" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label"><strong>Email *</strong></label>
          <input type="email" id="email" name="email" placeholder="Email"
                 th:field="*{email}" th:classappend="${hasError} ? 'is-invalid'" class="form-control" required>
          <div class="invalid-feedback" th:if="${hasError}" th:text="${hasError}"></div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label"><strong>Password *</strong></label>
          <input type="password" id="password" name="password" placeholder="Password"
                 th:field="*{password}" th:classappend="${hasError} ? 'is-invalid'" class="form-control" required>
          <div class="invalid-feedback" th:if="${hasError}" th:text="${hasError}"></div>
          <a href="#" class="d-block mt-2 text-primary">Forgot your password?</a> <!-- Password reset link -->
        </div>

        <!-- Login Button -->
        <button type="submit" class="btn w-100 mt-4" style="background-color: #2C3E50; color: white;">Log In</button>
      </form>

      <!-- Registration Link -->
      <div class="mt-4 text-center">
        <p class="text-muted">Not registered yet? <a th:href="@{/register}" class="fw-bold text-primary">Create an account</a></p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
