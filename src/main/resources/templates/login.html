<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:with="title='Login'"></title>
</head>
<body>
  <div layout:fragment="content">
    <div class="auth-form">
      <h2>Login</h2>
      <form th:action="@{/authenticate}" method="POST" th:object="${authenticationRequest}" novalidate>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email"
                 th:classappend="${hasError} ? 'input-error'"
                 th:value="${session.cachedEmail}"/>
        </div>

        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password"
                 th:field="*{password}"
                 th:classappend="${hasError} ? 'input-error'"/>
        </div>

        <ul th:if="${hasError}">
          <li th:text="${hasError}"
              class="error-message"></li>
        </ul>

        <button type="submit" class="btn btn-primary btn-full">Login</button>
      </form>

      <div class="auth-links">
        <p class="text-muted">Don't have an account? <a th:href="@{/register}">Register here</a></p>
      </div>
    </div>
  </div>
</body>
</html>
