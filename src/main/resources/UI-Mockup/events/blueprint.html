<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blueprint Details</title>
  <link rel="stylesheet" href="../../static/css/stylesheet.css">
</head>
<body>

<div class="container">
  <h2>Blueprint Details</h2>

  <div class="info-group">
    <label for="name">Name:</label>
    <p id="name">Summer Festival</p>
  </div>

  <div class="info-group">
    <label for="category">Category:</label>
    <p id="category">Music</p>
  </div>

  <div class="info-group">
    <label for="price">Price:</label>
    <p id="price">$20</p>
  </div>

  <div class="info-group">
    <label for="maxParticipants">Max Participants:</label>
    <p id="maxParticipants">100</p>
  </div>

  <div class="info-group">
    <label for="minParticipants">Min Participants:</label>
    <p id="minParticipants">20</p>
  </div>

  <div class="info-group">
    <label for="location">Location:</label>
    <p id="location">City Park</p>
  </div>

  <div class="info-group">
    <label for="county">County:</label>
    <p id="county">Example County</p>
  </div>

  <div class="info-group">
    <label for="zip">ZIP Code:</label>
    <p id="zip">12345</p>
  </div>

  <div class="info-group">
    <label for="street">Street:</label>
    <p id="street">Main St</p>
  </div>

  <div class="info-group">
    <label for="houseNumber">House Number:</label>
    <p id="houseNumber">100</p>
  </div>

  <div class="info-group">
    <label for="optionalLine">Optional Line:</label>
    <p id="optionalLine">Bring your own chair!</p>
  </div>

  <div>
    <button class="plan-event-button" onclick="window.location.href='/untitled/plan-event.html';">Plan Event</button>
  </div>
</div>

</body>
</html>
