<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Event Blueprint</title>
  <link rel="stylesheet" href="../../static/css/stylesheet.css">
</head>
<body>

<div class="form-container">
  <h2>Create Event Blueprint</h2>
  <form action="/create-blueprint" method="post">

    <div class="form-group">
      <label for="name">Name *</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
      <label for="category">Category *</label>
      <input type="text" id="category" name="category" required>
    </div>

    <div class="form-group">
      <label for="price">Price *</label>
      <input type="number" id="price" name="price" required>
    </div>

    <div class="form-group">
      <label for="maxParticipants">Max Participants *</label>
      <input type="number" id="maxParticipants" name="maxParticipants" required>
    </div>

    <div class="form-group">
      <label for="minParticipants">Min Participants *</label>
      <input type="number" id="minParticipants" name="minParticipants" required>
    </div>

    <div class="form-group">
      <label for="location">Location *</label>
      <input type="text" id="location" name="location" required>
    </div>

    <div class="form-group">
      <label for="county">County</label>
      <input type="text" id="county" name="county" class="optional">
    </div>

    <div class="form-group">
      <label for="zip">ZIP Code</label>
      <input type="text" id="zip" name="zip" class="optional">
    </div>

    <div class="form-group">
      <label for="street">Street</label>
      <input type="text" id="street" name="street" class="optional">
    </div>

    <div class="form-group">
      <label for="houseNumber">House Number</label>
      <input type="text" id="houseNumber" name="houseNumber" class="optional">
    </div>

    <div class="form-group">
      <label for="optionalLine">Optional Line</label>
      <input type="text" id="optionalLine" name="optionalLine" class="optional">
    </div>

    <div class="form-group">
      <input type="submit" value="Create Blueprint">
    </div>
  </form>
</div>

</body>
</html>
